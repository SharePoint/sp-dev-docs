name: 'Check for Incomplete Issues'

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  reaction:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/label-actions@65225c179d3b2502f6eda7b3d15101a3f412366b # v5.0.3
        with:
          github-token: ${{ github.token }}
          process-only: 'issues'
