  description: Frequently asked questions about publishing SharePoint Framework applications to the Marketplace
  ms.date: 10/28/2026
  ms.localizationpriority: high
    
title: Publish SharePoint Framework applications to the Marketplace - FAQ
summary: Following are some of the most frequently asked questions regarding publishing SharePoint Framework applications to the Marketplace.


sections:
  - name: SharePoint Store submissions
    questions:
      - question: |
          Is it required to configure web parts to be isolated for publishing in the Marketplace
        answer: |
          No. Domain-isolated web parts were retired in SharePoint Online on April 2, 2026. Don't configure a new Store solution to use domain isolation. Migrate existing solutions using the [domain-isolated web part retirement guidance](web-parts/isolated-web-parts-retirement.md). Copilot UX components' iframe hosting is a separate model, not the retired domain-isolation feature.

      - question: |
          Can I publish Copilot UX components to the SharePoint Store?
        answer: |
          Yes. Copilot UX components are supported in the SharePoint Store starting with SPFx 1.24 GA on October 28, 2026, including updates that add the capability to an existing Store solution. Package the declarative agent and components in the SPFx solution, and provide setup and test instructions.

          Disclose the required Microsoft 365 Copilot add-on USL on top of E3, E5, or E7, supported browser/desktop clients, and any API/service dependencies. The same license is required for development and testing, including Copilot Workbench. The component capability has no consumption-based charges. iOS and Android aren't supported at GA. See [Copilot UX component test guidance](publish-to-marketplace-checklist.md#copilot-ux-component-test-guidance).

      - question: |
          Do Copilot UX components have the same minimum SPFx version and test hosts as web parts?
        answer: |
          No. Copilot UX components require SPFx 1.24 or later, even though the general Store minimum for other SPFx solutions is 1.11. Test Copilot components in supported Copilot browser/desktop clients, not by adding them to a SharePoint page. The SharePoint site tests apply to web parts and other site-hosted components in the same solution.

          Follow the [Copilot test checklist](publish-to-marketplace-checklist.md#copilot-ux-component-test-guidance). Store availability doesn't remove the Copilot add-on license requirement, the iOS/Android exclusion at GA, or the combined Copilot/Teams automatic-sync limitation.

      - question: |
          Can I request additional API permissions for my solution
        answer: |
          Yes, if your solution needs additional API permissions to work as intended, then you should request these permissions to be granted in your solution’s manifest. Note, that the Marketplace verification team could ask you to justify access to the permissions that you have requested when verifying your submission.

      - question: |
          Can I expose my web parts in Office Add-ins
        answer: |
          At this moment exposing SharePoint Framework web parts in Office Add-ins are still in preview and is not yet supported in solutions published in the Marketplace.

      - question: |
          Can I include library components in my solution
        answer: |
          Yes, library components are fully supported in solutions published to the Marketplace.

      - question: |
          Can I use a custom Microsoft Teams manifest
        answer: |
          When building SharePoint Framework web parts, you can choose to [expose them in SharePoint and Microsoft Teams as personal apps or tabs](/sharepoint/dev/spfx/integrate-with-teams-introduction). To use your web parts in Teams, you can either generate the manifest and the Teams solution package yourself or have the SharePoint Framework generate it for you. Creating the manifest manually gives you more flexibility and allows you to create multi-tab personal apps.
          
          At this moment, the Marketplace does not support embedding custom Teams manifests in SharePoint Framework packages. You can expose your web parts in Teams using the manifest autogenerated by SharePoint Framework.

          SharePoint Store support for Copilot UX components includes the declarative-agent packaging generated for that capability. It isn't blanket approval for arbitrary custom Teams packages. The GA automatic-sync limitation for a combined Copilot/Teams solution has a manually created Teams package workaround for deployment; confirm the Store submission path for that combination with the review team. See [GA limitations](copilot/overview-copilot-apps.md#ga-limitations).
          
          If your web part requires configuration and you expose it as a personal Teams app, you need to implement a custom UI yourself to allow users to configure it in the web part.
