title: SharePoint Framework known issues and frequently asked questions
summary: This page is for listing any known issues or to answer any frequently asked questions about SharePoint Framework.


sections:
  - name: Current setup and support
    questions:
      - question: |
          Where should I start with SPFx 1.24?
        answer: |
          Follow [environment setup](set-up-your-development-environment.md) using Node.js 24 LTS and the SPFx 1.24 toolchain. Check the [compatibility reference](compatibility.md) for older projects and SharePoint Server deployments.
      - question: |
          Should I use the SharePoint workbench to debug web parts?
        answer: |
          Debug web parts on actual SharePoint pages using the [developer toolbar](debug-toolbar.md). The local workbench was removed in SPFx 1.13; the SharePoint Online workbench is deprecated and scheduled for retirement on December 1, 2026. Copilot Workbench is a separate, fully supported experience for Copilot UX components.
      - question: |
          What are the Copilot UX component requirements and limitations?
        answer: |
          See [Copilot availability](copilot/overview-copilot-apps.md#availability) for the required user-specific Copilot add-on license and supported browser/desktop clients. iOS/Android aren't supported at GA. A combined Copilot/Teams solution requires the manual Teams package workaround for the automatic-sync limitation.
  - name: Historical issues
    questions:
      - question: |
          Historical certificate issue with Chrome 58 and early SPFx releases
        answer: |
          This is a historical 2017 issue, not the current setup procedure. For modern projects, follow [developer certificate setup](set-up-your-development-environment.md#trusting-the-self-signed-developer-certificate) and page-based debugging with the [developer toolbar](debug-toolbar.md).

          - *Date - April 28, 2017*
          - *Updated - May 2, 2017*
          
          If you are using Chrome as your development browser, you might have challenges with the developer certificate regardless of executing the `gulp trust-dev-cert` command. Chrome has changed its model for certificate validation starting from version 58, and you might see a "Your connection is not private" warning when you are accessing the local workbench.
          
          You should update your Yeoman template packages. We have updated certification creation logic in the [*\@microsoft/gulp-core-build-serve* package](https://www.npmjs.com/package/@microsoft/gulp-core-build-serve).
          
          In existing solutions, you can simply delete this folder and run `npm install` to get the updated package. You also need to execute `untrust-dev-cert` and `trust-dev-cert` commands on your machine to address the certification creation logic issue.
          
  - name: Frequently asked questions
    questions:
      - question: |
          When will custom actions and JSLink be available in the SharePoint Framework?
        answer: |
          - *Date - June 6, 2017*
          
          SharePoint Framework Extensions with additional customization capabilities is now available in SharePoint Online. You can find more information about SharePoint Framework Extensions from our documentation:
          
          - [SharePoint Framework Extensions Overview](./extensions/overview-extensions.md)
          - [SharePoint Framework Extensions Tutorials](./extensions/get-started/build-a-hello-world-extension.md)
          
      - question: |
          Is SharePoint Framework available on premises?
        answer: |
          SharePoint Server 2016 Feature Pack 2 supports SPFx 1.1.0, and SharePoint Server 2019 supports SPFx through 1.4.1. Don't install the current SharePoint Online toolchain for a Server project. Follow the [Server development guidance](sharepoint-2019-and-subscription-edition-support.md) and [platform compatibility reference](compatibility.md), and verify the supported target for your Server edition.
          
